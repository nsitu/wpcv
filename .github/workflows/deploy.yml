name: Validate and deploy WordPress plugin

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate on WordPress ${{ matrix.wordpress }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        wordpress: ['6.5', latest]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wpcv-test
          MYSQL_DATABASE: wpcv_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.2'
          extensions: mysqli, dom, gd
          coverage: none
      - name: Lint PHP
        run: find plugin/wpcv tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript
        run: node --check plugin/wpcv/assets/cv.js
      - name: Check deployment scripts
        run: |
          bash -n scripts/deploy.sh scripts/remote-install.sh scripts/fetch-wp-cli.sh tests/deployment-preflight.sh
          shellcheck scripts/deploy.sh scripts/remote-install.sh scripts/fetch-wp-cli.sh tests/deployment-preflight.sh
      - name: Test container discovery failures
        run: bash tests/deployment-preflight.sh
      - name: Build plugin ZIP
        run: python3 scripts/build.py
      - name: Fetch verified WP-CLI
        run: bash scripts/fetch-wp-cli.sh
      - name: Test CV in a disposable WordPress installation
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
          WPCV_TEST_SITE: '1'
        run: |
          WP_TEST_PATH="$RUNNER_TEMP/wpcv-wordpress"
          php dist/wp-cli.phar core download --path="$WP_TEST_PATH" --version="$WORDPRESS_VERSION"
          php dist/wp-cli.phar config create --path="$WP_TEST_PATH" --dbname=wpcv_test --dbuser=root --dbpass=wpcv-test --dbhost=127.0.0.1:3306
          php dist/wp-cli.phar core install --path="$WP_TEST_PATH" --url=http://localhost --title='CV test' --admin_user=cv-admin --admin_password=local-test-only --admin_email=test@example.org --skip-email
          php dist/wp-cli.phar plugin install "$GITHUB_WORKSPACE/dist/wpcv.zip" --activate --path="$WP_TEST_PATH"
          php dist/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/wordpress-integration.php" --path="$WP_TEST_PATH"
          php dist/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/import-integration.php" --path="$WP_TEST_PATH"

  deploy:
    name: Deploy to WordPress
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: wpcv-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Build plugin ZIP
        run: python3 scripts/build.py
      - name: Fetch verified WP-CLI
        run: bash scripts/fetch-wp-cli.sh
      - name: Upload, install, and activate
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
          VM_PORT: ${{ vars.VM_PORT }}
          CAPROVER_SERVICE: ${{ vars.CAPROVER_SERVICE }}
          WP_PATH: ${{ vars.WP_PATH }}
          WP_RUN_USER: ${{ vars.WP_RUN_USER }}
        run: bash scripts/deploy.sh
